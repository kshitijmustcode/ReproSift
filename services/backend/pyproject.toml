[project]
name = "reprosift"
version = "0.0.0"
description = "ReproSift API and investigation backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.141.1",
    "langgraph==1.1.3",
    "mcp==2.2.0",
    "openai>=3.16.2",
    "psycopg[binary]==3.3.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.48",
    "uvicorn==0.53.0",
]

[project.scripts]
reprosift-api = "reprosift.cli:main"

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]
